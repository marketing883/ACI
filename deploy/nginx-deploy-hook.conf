# Add inside the existing `server { }` block for aciinfotech.com (the TLS
# one on 443). Do not create a second server block.
#
# Underscore-prefixed path so it cannot collide with a Next.js route: the
# app owns everything else on this host, and a deploy endpoint that shares
# a name with a future page would be a bad afternoon.

location = /__deploy {
    # HTTPS only. This box serves every site on port 80 as well and does
    # not redirect, so without this the endpoint accepts a bearer token in
    # cleartext - a token that runs code on the server. Learned the hard
    # way: a reachability probe sent a live token over port 80 and it had
    # to be rotated.
    #
    # `if` inside a location is normally worth avoiding, but a bare
    # `return` is one of the two constructs that is safe there.
    if ($scheme != "https") { return 400; }

    # A build can take several minutes; nginx must not give up first and
    # report a failure while the deploy is still running.
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;

    proxy_pass http://127.0.0.1:9099/deploy;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The hook authenticates the bearer token itself; this only keeps the
    # obvious noise out of the log and off the Python process.
    limit_except POST { deny all; }
}
