name: Deploy to staging

# Deploys to the staging VPS (staging.aciinfotech.com).
#
# Unlike production, this one auto-deploys: a push to a watched branch
# ships to staging without anyone opening a terminal. Staging exists to
# be looked at, so the push and the deploy are the same decision here.
# Production stays manual-dispatch-only in deploy-production.yml.
#
# Staging tracks whatever branch pushed last. There is one staging
# checkout and one service, so two active branches will take turns
# owning it - fine for a preview box with one reviewer, confusing with
# several. If that starts to bite, narrow the branch list below and ship
# the odd branch with Run workflow instead.
#
# The job announces which branch it deployed in the summary, so a
# surprising staging site is one click from an explanation.
#
# This drives the deploy hook over HTTPS rather than SSH. The hook
# already runs on the VPS as aciadmin with the staging unit's
# environment, so it gets the two things a hand-run deploy keeps getting
# wrong for free: the right user (root leaves root-owned node_modules in
# aciadmin's checkout and breaks every later deploy) and the right
# directory (the Next app is aci-infotech/ inside the repo, and the repo
# root has its own unrelated package.json).
#
# It needs one repository secret, STAGING_DEPLOY_TOKEN, which is the
# ACI_DEPLOY_TOKEN value in /etc/aci-deploy-staging.env on the VPS. That
# token deploys staging only; it cannot touch production.

on:
  push:
    branches:
      # Watch the branch shapes work actually lands on rather than one
      # branch by name, so the next piece of work deploys itself without
      # anyone remembering to edit this file. Add a pattern here if a new
      # naming convention shows up.
      - main
      - staging
      - 'claude/**'
      - 'feat/**'
      - 'fix/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to deploy (blank = the branch selected above)'
        required: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy
        env:
          TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}
          DEPLOY_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "$TOKEN" ]; then
            echo "!! STAGING_DEPLOY_TOKEN is not set for this repository."
            echo "!! Add it under Settings > Secrets and variables > Actions."
            echo "!! The value is ACI_DEPLOY_TOKEN in /etc/aci-deploy-staging.env on the VPS."
            exit 1
          fi

          echo "== deploying $DEPLOY_REF to staging =="
          {
            echo "### Staging deploy"
            echo ""
            echo "Ref: \`$DEPLOY_REF\`"
            echo ""
            echo "<https://staging.aciinfotech.com/>"
          } >> "$GITHUB_STEP_SUMMARY"

          # The hook is synchronous: it fetches, builds, restarts, health
          # checks and rolls back before it answers, so this call is
          # quiet for minutes on a normal deploy. -m covers the slowest
          # realistic build rather than curl's default of forever.
          code=$(curl -sS -m 1500 -o response.json -w '%{http_code}' \
            -X POST https://staging.aciinfotech.com/__deploy \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"ref\":\"$DEPLOY_REF\"}") || {
              echo "!! the deploy request itself failed (network, timeout, or nginx)"
              exit 1
            }

          echo "http=$code"
          python3 - <<'PY'
          import json, sys

          try:
              with open('response.json') as fh:
                  body = json.load(fh)
          except Exception:
              with open('response.json') as fh:
                  print(fh.read()[:4000])
              sys.exit('!! the hook did not return JSON')

          for stream in ('stdout', 'stderr'):
              text = body.get(stream)
              if text:
                  print(f'== {stream} ==')
                  print(text)

          if body.get('error'):
              sys.exit(f"!! hook refused the deploy: {body['error']}")

          exit_code = body.get('exit_code')
          if exit_code not in (0, None):
              sys.exit(f'!! deploy script exited {exit_code}')
          if not body.get('ok', False):
              sys.exit('!! hook reported failure')

          # The deploy script treats "the checkout is already on this
          # commit" as success and skips the build. That is right for a
          # repeated deploy and wrong when the checkout got there without
          # ever being built, which leaves the service on an older build
          # with a green deploy to show for it. Say so loudly.
          if 'nothing to deploy' in (body.get('stdout') or ''):
              print('!! NOTE: the hook skipped the build - the checkout was already on this commit.')
              print('!! If staging is not serving this code, force a rebuild on the VPS:')
              print('!!   sudo -u aciadmin ACI_FORCE=1 ACI_SERVICE=aci-staging.service \\')
              print('!!     ACI_ENV_SRC=/var/www/aci-staging/aci-infotech/aci-infotech/.env.staging \\')
              print('!!     /usr/local/bin/aci-deploy <ref>')

          print('deploy ok')
          PY

          if [ "$code" != "200" ]; then
            echo "!! hook returned HTTP $code"
            exit 1
          fi

      - name: Verify the public site
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://staging.aciinfotech.com/ || echo 000)
            echo "attempt $i: https://staging.aciinfotech.com/ -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "!! staging did not answer 200 over HTTPS"
          exit 1
